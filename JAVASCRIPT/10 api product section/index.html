


<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Commerce UI</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="main-container">
    <h1 class="heading">Product Section</h1>

    <div class="product-grid" id="productGrid">
      <div class="card1">
        <img src="https://rukminim2.flixcart.com/image/312/312/xif0q/mobile/x/c/y/-original-imah57jbfqsz6797.jpeg?q=70"
          alt="">
        <h3 class="card-title">Mobile</h3>
        <p class="p">₹5,000</p>
        <button onclick="addToCart('Mobile', 5000, 'https://rukminim2.flixcart.com/image/312/312/xif0q/mobile/x/c/y/-original-imah57jbfqsz6797.jpeg?q=70')" class="button">Add To Cart</button>
      </div>
      <div class="card1">
        <img
          src="https://rukminim2.flixcart.com/image/312/312/xif0q/television/h/h/2/-original-imahjf6yhzphyzcu.jpeg?q=70"
          alt="">
        <h3 class="card-title">LED Smart Google TV</h3>
        <p class="p">₹15,000</p>
        <button onclick="addToCart('LED Smart Google TV', 15000)" class="button">Add To Cart</button>
      </div>
      <div class="card1">
        <img
          src="https://rukminim2.flixcart.com/image/612/612/xif0q/watch/f/e/c/-resized-2-original-imagrk9rqxqhkn5e.jpeg?q=70"
          alt="">
        <h3 class="card-title">Watch</h3>
        <p class="p">₹900</p>
        <button onclick="addToCart('Watch', 900)" class="button">Add To Cart</button>
      </div>
      <div class="card1">
        <img src="https://rukminim2.flixcart.com/image/312/312/xif0q/mobile/x/c/y/-original-imah57jbfqsz6797.jpeg?q=70"
          alt="">
        <h3 class="card-title">Mobile</h3>
        <p class="p">₹5,000</p>
        <button onclick="addToCart('Mobile', 5000)" class="button">Add To Cart</button>
      </div>
      <div class="card1">
        <img src="https://rukminim2.flixcart.com/image/312/312/xif0q/mobile/x/c/y/-original-imah57jbfqsz6797.jpeg?q=70"
          alt="">
        <h3 class="card-title">Mobile</h3>
        <p class="p">₹5,000</p>
        <button onclick="addToCart('Mobile', 5000)" class="button">Add To Cart</button>
      </div>
    </div>

    <h1 class="heading mt-5">Added To Cart</h1>
    <div class="cart" id="cart"></div>
  </div>

  <script src="script.js"></script>

</body>
</html>
