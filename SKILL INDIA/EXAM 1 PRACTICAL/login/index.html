            <div class="form">
                <h1>Sign Up</h1>
                <form id="signupForm">
                    <div class="input">
                        <input type="text" id="name" placeholder="First name">
                    </div>
                    <div class="input">
                        <input type="text" id="lastname" placeholder="Last name">
                    </div>
                    <div class="input">
                        <input type="email" id="email" placeholder="Email address">
                    </div>
                    <div class="input">
                        <input type="password" id="password" placeholder="Password">
                    </div>
                    <div class="checkbox">
                        <input type="checkbox" id="terms">
                        <p>Accept Terns & Continue</p>
                    </div>
                    <div class="button">
                        <button type="submit">Join Us <i class="fa-solid fa-arrow-right"></i> </button>
                    </div>
                    <div class="line-main">
                        <div class="line"></div>
                        <p>or</p>
                        <div class="line"></div>
                    </div>
                    <div class="button1">
                        <button type="button"> <i class="fa-brands fa-google"></i> Sign up with Google</button>
                    </div>
                    <div class="button2">
                        <button type="button"> <i class="fa-brands fa-apple"></i> Sign up with Apple</button>
                    </div>
                    <p style="margin-top: 5px;">I have already registered <a href="login.html"> login</a></p>
                </form>
            </div>
        </div>

    </section>




    <script>
        let form = document.getElementById("signupForm");
        form.addEventListener("submit", function (e) {
            e.preventDefault();
            let firstName = document.getElementById("name").value.trim()
            let lastname = document.getElementById("lastname").value.trim()
            let email = document.getElementById("email").value.trim()
            let password = document.getElementById("password").value.trim()
            let terms = document.getElementById("terms").checked;

            if (firstName === "" || lastname === "" || email === "" || password === "") {
                alert("please fill all details.")
                return;
            }

            if (!terms) {
                alert("Please accept Terms & Conditions");
                return;
            }


            let users = JSON.parse(localStorage.getItem("users")) || [];
            let check = users.find(u => u.email === email);
            if (check) {
                alert("You have already registered, please login.")
                window.location.href = "login.html"
                return;
            }

            users.push({
                firstName: firstName,
                lastname:lastname,
                email:email,
                password: password
            })


            localStorage.setItem("users", JSON.stringify(users))
            alert("Sign up succesfully!");
            window.location.href = "home.html"


        }) 


        </script>
